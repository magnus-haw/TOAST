[build-system]
requires = [
    "setuptools>=69",
    "wheel",
]
build-backend = "setuptools.build_meta"


# =====================================================================
# Project metadata
# =====================================================================

[project]
name = "toast"
version = "0.2.0"

description = "2-D finite-element heat-transfer modeling for building-envelope assemblies and thermal bridges."

readme = "README.md"

requires-python = ">=3.12,<3.13"

authors = [
    { name = "Magnus Haw" },
]

keywords = [
    "heat-transfer",
    "thermal",
    "finite-element",
    "fenics",
    "dolfinx",
    "gmsh",
    "building-physics",
    "thermal-bridge",
    "building-envelope",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: MacOS",
    "Operating System :: POSIX",
]


# =====================================================================
# Python runtime dependencies
#
# Compiled numerical packages are intentionally NOT included here:
#
#   fenics-dolfinx
#   petsc / petsc4py
#   mpi / mpi4py
#   gmsh / python-gmsh
#
# These should come from the conda-forge environment so the PETSc,
# MPI, OpenMP, and solver libraries remain binary-compatible.
# =====================================================================

dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
]


# =====================================================================
# Optional Python-only dependencies
# =====================================================================

[project.optional-dependencies]

visualization = [
    "pyvista>=0.44",
]

analysis = [
    "pandas>=2.0",
]

test = [
    "pytest>=8",
]

dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
    "build>=1.2",
]

all = [
    "pyvista>=0.44",
    "pandas>=2.0",
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
    "build>=1.2",
]


# =====================================================================
# setuptools / src layout
# =====================================================================

[tool.setuptools]
package-dir = { "" = "src" }


[tool.setuptools.packages.find]
where = ["src"]
include = ["toast*"]


# =====================================================================
# pytest
# =====================================================================

[tool.pytest.ini_options]

minversion = "8.0"

testpaths = [
    "tests",
]

pythonpath = [
    "src",
]

addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]

markers = [
    "verification: analytic or manufactured-solution verification tests",
    "benchmark: physical benchmark or numerical regression tests",
    "fenics: tests requiring DOLFINx/PETSc",
    "gmsh: tests requiring Gmsh",
    "slow: relatively expensive numerical tests",
]


# =====================================================================
# Ruff
# =====================================================================

[tool.ruff]

target-version = "py312"

line-length = 100

src = [
    "src",
    "tests",
    "examples",
]

exclude = [
    ".git",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "build",
    "dist",
]


[tool.ruff.lint]

select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "SIM",
]

ignore = [
    "E501",
]


[tool.ruff.lint.isort]

known-first-party = [
    "toast",
]


[tool.ruff.format]

quote-style = "double"
indent-style = "space"
line-ending = "auto"


# =====================================================================
# mypy
#
# Deliberately permissive around external scientific libraries because
# DOLFINx, PETSc, Gmsh, and MPI do not all expose complete type info.
# =====================================================================

[tool.mypy]

python_version = "3.12"

files = [
    "src/toast",
]

ignore_missing_imports = true

check_untyped_defs = true

disallow_untyped_defs = false

warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true


# =====================================================================
# Coverage
# =====================================================================

[tool.coverage.run]

source = [
    "toast",
]

branch = true


[tool.coverage.report]

show_missing = true
skip_covered = true

exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]